<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Hors connexion — Shop Crew Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1b2e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        background: #0b1b2e; color: #eafaf5;
        font: 15px/1.55 "DM Sans", system-ui, -apple-system, sans-serif;
      }
      .card { max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
      p { color: #9fb4c7; margin: 0 0 1.5rem; }
      button {
        background: #2ff2a8; color: #0b1b2e; border: 0; border-radius: 0.75rem;
        padding: 0.7rem 1.25rem; font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Shop Crew Hub" width="192" height="192" />
      <h1>Vous êtes hors connexion</h1>
      <p>
        Impossible de charger cette page. Vérifiez votre connexion internet, puis réessayez —
        vos pages déjà visitées restent disponibles.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
